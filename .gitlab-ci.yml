.base_ruff:
  stage: build
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:0.16.8-alpine
  before_script:
    - cd $CI_PROJECT_DIR
    - ruff --version

variables:
  UV_VERSION: "0.12.16"
  PYTHON_VERSION: "3.13"
  BASE_LAYER: trixie-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

ty:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  script:
    - uvx ty check --output-format gitlab --output-file=code-quality-report-ty.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report-ty.json

format:
  extends: .base_ruff
  script:
    - ruff format --check
    - ruff check --output-format=gitlab --output-file=code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json
